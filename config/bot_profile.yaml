# Профиль бота в Telegram. Применяется командой: uv run python tools/setup_bot_profile.py
# Лимиты Bot API: name — 64 символа, short_description — 120, description — 512.
# Аватар задаётся вручную через @BotFather (/setuserpic).

name: "Бриф на разработку — Владимир Егоров"
short_description: "Соберу бриф на бота, ИИ-ассистента или парсер за 5–7 минут. Владимир Егоров, Python-разработчик."
description: |
  Помогаю описать задачу на разработку: Telegram-боты, ИИ-ассистенты, парсинг, интеграции, отчёты.
  Задам 8–12 вопросов, соберу бриф и передам Владимиру Егорову — Python-разработчику. Это займёт 5–7 минут.
  Нажмите «Начать» и опишите задачу своими словами.
