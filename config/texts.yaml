help: |
  Я помогаю описать задачу на разработку и собираю бриф — документ, по которому её проще оценить.
  /start — начать бриф
  /new — начать заново
  /cancel — отменить текущий бриф
  /privacy — какие данные я храню
  /delete_my_data — удалить мои данные
  Связаться с Владимиром напрямую: @{owner_username}
privacy: |
  Я сохраняю описание задачи, ваши ответы и контакт (имя и способ связи), чтобы Владимир мог с вами связаться.
  Данные хранятся на сервере в России до 180 дней. Удалить их можно командой /delete_my_data.
